[workspace]
members = ["crates/*"]

[package]
name = "pybot-rs"
version = "0.2.0"
edition = "2021"
description = "A Rust port of PyBot: a chatbot written in plain rules. No weights, no training, just rules."
license = "Apache-2.0"

[dependencies]
pyrt = { path = "crates/pyrt" }
gen_meta = { path = "crates/gen_meta" }
indexmap = "2"

[profile.dev]
opt-level = 0
debug = false
codegen-units = 256

[profile.release]
opt-level = 2

[profile.dev.package.pyrt]
opt-level = 2
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.fancy-regex]
opt-level = 2
