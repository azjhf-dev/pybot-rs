[package]
name = "pybot-rs"
version = "0.2.0"
edition = "2021"
description = "A Rust port of PyBot: a chatbot written in plain rules. No weights, no training, just rules."
license = "Apache-2.0"

[dependencies]
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
indexmap = "2"
unicode-normalization = "0.1"

[profile.dev]
opt-level = 0
debug = false
codegen-units = 256

[profile.release]
opt-level = 2
